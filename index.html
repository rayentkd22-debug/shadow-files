<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0b10">
<title>ملفات الظل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--ink:#0c0b10;--sm:#17161d;--sm2:#211f29;--paper:#d9cfba;--blood:#8e1626;--brass:#a98a4e;--tx:#e9e4d8;--mut:#8d887c}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--tx);font-family:'Tajawal',system-ui,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(60% 40% at 80% 0,#3a0d1566,transparent),radial-gradient(50% 35% at 10% 100%,#2a243a77,transparent);pointer-events:none}
.wrap{max-width:520px;margin:auto;padding:18px 16px 100px;position:relative}
h1,h2{font-weight:900}
h1{font-size:2.4rem;margin:18px 0 6px}
.stamp{display:inline-block;border:3px solid var(--blood);color:var(--blood);padding:4px 16px;font-weight:900;font-size:1.3rem;transform:rotate(-6deg);border-radius:4px}
.stamp.a{animation:st .6s ease-out both}
@keyframes st{from{opacity:0;transform:rotate(-16deg) scale(2.2)}to{opacity:1;transform:rotate(-6deg) scale(1)}}
@media(prefers-reduced-motion:reduce){.stamp.a{animation:none}}
.btn{width:100%;padding:14px;border:1px solid var(--brass);background:transparent;color:var(--tx);border-radius:6px;font:700 1rem Tajawal;margin-top:10px}
.btn.p{background:var(--blood);border-color:var(--blood)}
.btn.s{width:auto;padding:8px 14px;font-size:.85rem;margin:0 0 10px}
.card{background:var(--sm);border:1px solid var(--sm2);border-right:4px solid var(--blood);padding:14px;margin:12px 0;border-radius:6px}
.card.real{border-right-color:var(--brass)}
.paper{background:var(--paper);color:#241f18;padding:14px;border-radius:3px;margin:10px 0;line-height:1.9}
.q{display:block;width:100%;text-align:right;background:var(--sm2);color:var(--tx);border:0;padding:12px;margin:6px 0;border-radius:6px;font:500 .95rem Tajawal}
.q[disabled]{opacity:.4}
.ans{background:#0007;border-right:3px solid var(--brass);padding:10px;margin:6px 0;border-radius:4px;line-height:1.8}
.tag{font-size:.78rem;color:var(--brass)}
.mut{color:var(--mut);line-height:1.8}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0c0b10f2;border-top:1px solid var(--sm2);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:13px 0;background:none;border:0;color:var(--mut);font:700 .82rem Tajawal}
nav button.on{color:var(--brass)}
input{width:100%;padding:13px;margin-top:8px;background:var(--sm);border:1px solid var(--sm2);color:var(--tx);border-radius:6px;font:1rem Tajawal}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--blood);padding:10px 16px;border-radius:6px;z-index:9;display:none;max-width:90%;text-align:center}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
</style>
</head>
<body>
<div id="toast"></div>
<main id="v" class="wrap"></main>
<nav id="nav" hidden>
<button data-t="cases" onclick="go('cases')">مستوحاة</button>
<button data-t="puzzles" onclick="go('puzzles')">ألغاز</button>
<button data-t="real" onclick="go('real')">ملفات حقيقية</button>
<button data-t="me" onclick="go('me')">حسابي</button>
</nav>
<script>
/* ===== الإعدادات: ضع مفاتيح مشروع Supabase الجديد هنا ===== */
const CFG={url:'https://nytjqbeloqfomkancpya.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55dGpxYmVsb3Fmb21rYW5jcHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NjE2OTgsImV4cCI6MjEwODQzNzY5OH0.JgxXIAGqcmuNlmjb1mUZuxupR6botSsTXiq4XXOnJ4A',admin:'rayentkd22@gmail.com'};

const D=[
{id:1,k:'tn',tag:'مستوحاة من قضايا حقيقية · بأسماء مبدّلة',t:'قضية الفيلا الزرقاء',
i:'الساعة 7 الصباح، الحارس لقى سالم بن عمار، رجل أعمال، ميت في مكتبو بفيلا الحمامات. الطبيب الشرعي يقول الوفاة صارت بين 21:30 و22:30 بضربة على الراس بحاجة صلبة.',
ev:['تقرير الطب الشرعي: ضربة على مؤخرة الراس، الوفاة قبل 22:30.','كاميرا البوابة: سيارة دخلت 21:50 وخرجت 22:40، واللوحة مطموسة.'],
s:[
{n:'هدى',r:'الزوجة',q:[
['وين كنتي ليلة الجريمة؟','كنت عند أختي في نابل. رجعت على 23:15 ولقيت الضو مطفي في المكتب، ما حبيتش نزعجو.',''],
['كان عندو أعداء؟','خصامو الكبير كان مع منصف على فلوس الشركة. قبل يومين هدّدو قدامي وقالو: "تندم".','منصف هدّد الضحية قبل يومين']]},
{n:'منصف',r:'الشريك',q:[
['وين كنت الليلة؟','كنت في تونس العاصمة في اجتماع حتى نص الليل، والله العظيم.',''],
['شنوة الخلاف اللي بيناتكم؟','خلاف عادي في الشغل، ما يستاهلش نحكيو عليه.',''],
['لقينا تذكرة أوتوروت الحمامات 21:40 في سيارتك. كيفاش؟','(يسكت) ... عديت نخلص، ما يعني شي. ما دخلتش للفيلا.','تذكرة أوتوروت الحمامات 21:40 في سيارة منصف']]},
{n:'كمال',r:'السواق',q:[
['وين كنت؟','في الدار مع عيلتي. الحارس شافني نخرج على 20:00.','كمال غادر 20:00 حسب الحارس']
,['كان عندك مشكل مع الباترون؟','إي، خصمنا على الأجر. أما نقتلو؟ لا والله، أنا راجل ساكت.','']]}],
x:1,v:'القاتل منصف. السيارة اللي دخلت 21:50 هي سيارتو، وتذكرة الأوتوروت تكذّب حجة الاجتماع في العاصمة، والتهديد قبل يومين يثبت الدافع. كمال خرج 20:00 وهدى كانت في نابل.'},
{id:2,k:'pz',tag:'لغز معقّد',t:'الغرفة المغلقة',
i:'وُجد الأستاذ الجامعي عادل الراشد ميتاً في مكتبه عند الثامنة مساءً. الباب مقفل من الداخل والنافذة مغلقة بإحكام. لا آثار عنف ولا سلاح.',
ev:['تقرير الطب الشرعي: سمّ بطيء المفعول، تناوله قبل ساعتين إلى ثلاث من الوفاة.','المكتب مقفل من الداخل، وبقايا شاي في الكوب على الطاولة.'],
s:[
{n:'سلمى',r:'سكرتيرة القسم',q:[
['من أحضر المشروبات؟','الدكتور خالد أحضر الشاي الساعة 17:00. أنا لم أدخل المكتب أبداً.','الشاي أحضره خالد الساعة 17:00'],
['متى رأيتِه آخر مرة؟','قرابة 19:00، كان يتحدث بالهاتف وبحالة جيدة.','']]},
{n:'يوسف',r:'طالب دراسات عليا',q:[
['أين كنت مساء ذلك اليوم؟','في المكتبة حتى إغلاقها الساعة 21:00، والكاميرات تثبت ذلك.','يوسف كان في المكتبة وقت الوفاة'],
['هل بينكما خلاف؟','رسبت في مادته، لكنه وعدني بإعادة التصحيح.','']]},
{n:'خالد',r:'زميل في القسم',q:[
['ماذا فعلت عصر ذلك اليوم؟','زرته لنتناقش في بحث مشترك، ولم أبقَ طويلاً.',''],
['هل أحضرت له شيئاً؟','ربما أحضرت شاياً كعادتي... لكنه بالتأكيد لم يكن مسموماً!',''],
['ما سبب الخلاف على البحث؟','قال إنه سينشره باسمه وحده. كان ظلماً... لكنني لم أقتله!','دافع خالد: نسب البحث لنفسه']]}],
x:2,v:'القاتل خالد. السم بطيء المفعول، والشاي الوحيد دخل المكتب بيده الساعة 17:00، فالتوقيت يطابق الوفاة في الثامنة. يوسف كان في المكتبة وسلمى لم تدخل، ودافع خالد هو الخلاف على نسب البحث.'}];

const sb=CFG.url&&window.supabase?supabase.createClient(CFG.url,CFG.key):null;
const $=s=>document.querySelector(s);
const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
let user=L('u'),S=L('s')||{pts:0,done:[]},tab='cases',C=null,G=null;
const save=()=>{try{localStorage.setItem('s',JSON.stringify(S));localStorage.setItem('u',JSON.stringify(user))}catch(e){}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}
function setU(u){user={email:u.email||'',name:(u.user_metadata&&u.user_metadata.name)||(u.email||'ضيف').split('@')[0]};save();go('cases')}

async function oauth(p){if(!sb)return toast('أضف مفاتيح Supabase أولاً في أعلى الملف');await sb.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin}})}
async function mail(){if(!sb)return toast('أضف مفاتيح Supabase أولاً في أعلى الملف');const e=$('#em').value.trim(),p=$('#pw').value;if(!e||p.length<6)return toast('أدخل إيميلاً صحيحاً وكلمة سر من 6 أحرف');let r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error){r=await sb.auth.signUp({email:e,password:p});if(r.error)return toast(r.error.message)}if(r.data.session)setU(r.data.user);else toast('تفقد إيميلك لتأكيد الحساب')}
function guest(){setU({email:'',user_metadata:{name:'ضيف'}})}
function out(){if(sb)sb.auth.signOut();user=null;try{localStorage.removeItem('u')}catch(e){}draw()}

function go(t){tab=t||tab;C=null;G=null;draw();scrollTo(0,0)}
function open_(id){C=D.find(c=>c.id===id);G={clues:[],asked:{},log:{},wrong:0,res:null};draw();scrollTo(0,0)}
function ask(si,qi){const k=si+'-'+qi;if(G.asked[k])return;G.asked[k]=1;const q=C.s[si].q[qi];(G.log[si]=G.log[si]||[]).push([q[0],q[1]]);if(q[2]&&!G.clues.includes(q[2]))G.clues.push(q[2]);draw()}
function accuse(si){if(si===C.x){let p=Math.max(10,50+G.clues.length*25-G.wrong*10);if(S.done.includes(C.id))p=0;else S.done.push(C.id);S.pts+=p;save();G.res=p}else{G.wrong++;toast('اتهام خاطئ. كمّل التحقيق وراجع الأدلة')}draw()}

const rank=p=>p<50?'متدرب':p<200?'محقق':p<400?'مفتش':'رئيس الفرقة';
const list=k=>D.filter(c=>c.k===k).map(c=>`<div class="card"><div class="tag">${c.tag}</div><h2>${c.t}</h2><p class="mut" style="margin:6px 0">${c.i.slice(0,75)}...</p><button class="btn" onclick="open_(${c.id})">${S.done.includes(c.id)?'أعد التحقيق':'افتح الملف'}</button></div>`).join('');

function authH(){return `<span class="stamp a">سرّي</span><h1>ملفات الظل</h1><p class="mut">اقرأ الملف، استجوب المشتبهين، واكشف القاتل قبل ما يضيع الدليل.</p>
<button class="btn p" onclick="oauth('google')">الدخول بـ Google</button>
<button class="btn" onclick="oauth('facebook')">الدخول بـ Facebook</button>
<input id="em" type="email" placeholder="الإيميل" autocomplete="email"><input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">
<button class="btn" onclick="mail()">دخول / حساب جديد بالإيميل</button>
<button class="btn" style="border-color:var(--sm2);color:var(--mut)" onclick="guest()">ادخل كضيف</button>`}
const casesH=()=>`<h1>قضايا مستوحاة</h1><p class="mut">أجواء تونسية وشخصيات مبدّلة. استجواب كامل بالدارجة.</p>${list('tn')}`;
const puzH=()=>`<h1>ألغاز معقّدة</h1><p class="mut">قضايا أصلية بعربية يفهمها كل العرب، وأدلتها متشابكة.</p>${list('pz')}`;
const realH=()=>`<h1>ملفات حقيقية</h1><div class="card real"><h2>قريباً</h2><p class="mut">كل ملف يحتوي وقائع موثّقة فقط: تسلسل زمني، الحكم، ورابط المصدر تحت كل معلومة. الصور من مصادر مرخّصة مع ذكر المصدر، وبدون صور للضحايا. على كل ملف زر "طلب الحذف". المشرف يضيف الملفات من لوحة الإدارة.</p></div>`;
const meH=()=>`<h1>${user.name}</h1><div class="paper"><b>الرتبة:</b> ${rank(S.pts)}<br><b>النقاط:</b> ${S.pts}<br><b>القضايا المحلولة:</b> ${S.done.length} من ${D.length}</div>${user.email===CFG.admin?'<button class="btn p" onclick="go(\'admin\')">لوحة المشرف</button>':''}<button class="btn" onclick="out()">خروج</button>`;
const admH=()=>user.email===CFG.admin?`<button class="btn s" onclick="go('me')">رجوع</button><h1>لوحة المشرف</h1><div class="paper">القضايا في التطبيق: ${D.length}<br>المشرف: ${CFG.admin}</div><div class="card"><p class="mut">الخطوة الجاية: ربط جدول الملفات الحقيقية وإدارة المستخدمين في Supabase، وحماية الصلاحيات بقواعد RLS على الخادم.</p></div>`:'<p class="mut">غير مسموح.</p>';

function caseH(){
let h=`<button class="btn s" onclick="go()">رجوع</button><span class="stamp">${C.k==='tn'?'ملف سرّي':'لغز'}</span><h1>${C.t}</h1><div class="paper">${C.i}</div><div class="paper"><b>الأدلة:</b><br>${C.ev.map(e=>'• '+e).join('<br>')}</div>`;
if(G.res!==null){return h+`<div class="card real"><h2>تم حل القضية</h2><p class="mut" style="margin:8px 0">${C.v}</p><b>${G.res?'+'+G.res+' نقطة':'سبق حلها، بدون نقاط جديدة'}</b></div><button class="btn p" onclick="go()">قضية أخرى</button>`}
h+='<h2 style="margin-top:18px">الاستجواب</h2>';
C.s.forEach((p,si)=>{h+=`<div class="card"><b>${p.n}</b> <span class="tag">${p.r}</span>`+(G.log[si]||[]).map(a=>`<div class="ans"><div class="tag">${a[0]}</div>${a[1]}</div>`).join('')+p.q.map((q,qi)=>G.asked[si+'-'+qi]?'':`<button class="q" onclick="ask(${si},${qi})">${q[0]}</button>`).join('')+'</div>'});
h+=`<div class="paper"><b>الخيوط (${G.clues.length}):</b><br>${G.clues.length?G.clues.map(c=>'• '+c).join('<br>'):'ما لقيت شي لحد الآن'}</div><h2 style="margin-top:18px">اتهم القاتل</h2>`;
C.s.forEach((p,si)=>{h+=`<button class="btn" onclick="accuse(${si})">${p.n} (${p.r})</button>`});
return h}

function draw(){const v=$('#v'),n=$('#nav');if(!user){n.hidden=true;v.innerHTML=authH();return}
n.hidden=false;[...n.children].forEach(b=>b.classList.toggle('on',b.dataset.t===(tab==='admin'?'me':tab)));
v.innerHTML=C?caseH():({cases:casesH,puzzles:puzH,real:realH,me:meH,admin:admH}[tab])()}

if(sb){sb.auth.getSession().then(({data})=>{if(data.session)setU(data.session.user);else draw()});sb.auth.onAuthStateChange((e,s)=>{if(s&&!user)setU(s.user)})}else draw();
</script>
</body>
</html>
