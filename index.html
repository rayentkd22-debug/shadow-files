function open_(id){const c0=D.find(c=>c.id===id);if(locked(c0))return toast('الملف مقفل');const fl=S.fl&&S.fl[id];if(fl&&Date.now()-fl<36e5)return toast('الملف مقفل بعد الفشل. ارجع بعد '+Math.ceil((36e5-(Date.now()-fl))/6e4)+' دقيقة');C=c0;G={clues:[],asked:{},log:{},wrong:0,res:null,stage:0,sel:[],fail:false};draw();scrollTo(0,0)}
function ask(si,qi){const k=si+'-'+qi;if(G.asked[k])return;G.asked[k]=1;const q=C.s[si].q[qi];(G.log[si]=G.log[si]||[]).push([q[0],q[1]]);if(q[2]&&!G.clues.includes(q[2]))G.clues.push(q[2]);draw()}
const maxA=()=>Math.max(2,Math.ceil(C.s.length/2));
function bad(){sfx('bad');G.wrong++;if(G.wrong>=maxA()){G.fail=true;S.fl=S.fl||{};S.fl[C.id]=Date.now();save()}else toast('رفضت المحكمة الاتهام. باقيلك '+(maxA()-G.wrong)+' محاولة')}
function win(){let p=Math.max(10,50+G.clues.length*25-G.wrong*10)+((C.acc||[]).length?30:0);if(S.done.includes(C.id))p=0;else S.done.push(C.id);S.pts+=p;save();push();G.res=p;sfx('ok')}
function accuse(si){if(G.fail)return;if(si===C.x&&(C.key||[]).every(k=>G.clues.includes(k))){if((C.acc||[]).length){G.stage=1;G.sel=[]}else win()}else bad();draw()}
function selA(i){const k=G.sel.indexOf(i);k<0?G.sel.push(i):G.sel.splice(k,1);draw()}
function confA(){[...G.sel].sort().join()===[...C.acc].sort().join()?win():bad();if(G.fail)G.stage=0;draw()}

const rank=p=>p<50?'متدرب':p<200?'محقق':p<400?'مفتش':'رئيس الفرقة';
const locked=c=>c.sec&&!D.filter(x=>!x.sec).every(x=>S.done.includes(x.id));
const list=k=>D.filter(c=>c.k===k).map(c=>`<div class="card"><div class="tag">${locked(c)?'ملف سري':esc(c.tag)}</div><h2>${locked(c)?'████████':esc(c.t)}</h2><p class="mut" style="margin:6px 0">${locked(c)?'':esc(c.i.slice(0,75))+'...'}</p>${locked(c)?'<p class="mut">🔒 ينفتح بعد حل كل القضايا العادية</p>':`<button class="btn" onclick="open_(${c.id})">${S.done.includes(c.id)?'أعد التحقيق':'افتح الملف'}</button>`}</div>`).join('');

<button class="btn p" onclick="oauth('google')">الدخول بـ Google</button>
<button class="btn" onclick="oauth('facebook')">الدخول بـ Facebook</button>
<input id="em" type="email" placeholder="الإيميل" autocomplete="email"><input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">
<button class="btn" onclick="mail()">دخول / حساب جديد بالإيميل</button>
<button class="btn" style="border-color:var(--sm2);color:var(--mut)" onclick="guest()">ادخل كضيف</button>`}
const hero=k=>{const a=D.filter(c=>c.k===k&&!c.sec),n=a.filter(c=>S.done.includes(c.id)).length;return `<div class="card real"><b>${n} من ${a.length} محلولة</b><div class="bar"><i style="width:${a.length?Math.round(n/a.length*100):0}%"></i></div><p class="mut">الاتهام يحتاج أدلة، وكل خطأ يضيّع محاولة. حل القضايا كلها باش تنفتح الملفات السرية.</p><button class="btn" onclick="go('co')">👥 العب مع صحابك</button></div>`};
const casesH=()=>`<h1>قضايا مستوحاة</h1><p class="mut">أجواء تونسية وشخصيات مبدّلة. استجواب كامل بالدارجة.</p><div class="card real" onclick="go('real')"><b>📁 ملفات حقيقية</b><p class="mut">وقائع موثّقة مع المصادر</p></div>${hero('tn')}${list('tn')}<div class="card"><p class="mut">ملفات جديدة تتزاد قريباً…</p></div>`;
const puzH=()=>`<h1>ألغاز معقّدة</h1><p class="mut">قضايا أصلية بعربية يفهمها كل العرب، وأدلتها متشابكة.</p>${hero('pz')}${list('pz')}<div class="card"><p class="mut">ألغاز جديدة تتزاد قريباً…</p></div>`;
const realH=()=>`<h1>ملفات حقيقية</h1><p class="mut">وقائع موثّقة فقط مع المصدر، وبدون صور ضحايا. التحقيق التفاعلي والاستجواب في القضايا المستوحاة.</p>${R.map(x=>`<div class="card real"><div class="tag">${x.tag}</div><h2>${x.t}</h2><p class="mut" style="margin:6px 0">${x.sum}</p><button class="btn" onclick="openR('${x.id}')">افتح الملف</button></div>`).join('')}`;
const topH=()=>{setTimeout(loadTop,0);return '<h1>المتصدرون</h1><div id="tb"><p class="mut">جاري التحميل...</p></div>'};
const RK=[[0,'متدرب'],[50,'محقق'],[200,'مفتش'],[400,'رئيس الفرقة']];
const BD=[['أول خيط',()=>S.done.length>=1],['محقق',()=>S.pts>=50],['مفتش',()=>S.pts>=200],['حلّال القضايا',()=>S.done.length>0&&D.filter(c=>!c.sec).every(c=>S.done.includes(c.id))],['3 أيام',()=>(S.st||0)>=3],['أسبوع كامل',()=>(S.st||0)>=7]];
const meH=()=>{const i=RK.filter(x=>S.pts>=x[0]).length-1,nx=RK[i+1],pc=nx?Math.round((S.pts-RK[i][0])/(nx[0]-RK[i][0])*100):100;return `<div class="pf"><label>${av({n:user.name,img:user.img})}<input type="file" accept="image/*" hidden onchange="pickMe(this)"></label><h1 style="margin:4px 0">${esc(user.name)}</h1><div class="tag">${RK[i][1]} · ${S.pts} نقطة</div><div class="bar"><i style="width:${pc}%"></i></div><p class="mut">${nx?'باقي '+(nx[0]-S.pts)+' نقطة لرتبة '+nx[1]:'وصلت لأعلى رتبة'}</p><div class="stats"><div><b>${S.pts}</b>نقطة</div><div><b>${S.done.length}</b>قضية</div><div><b>${S.st||1}</b>🔥 يوم</div></div></div><input id="nm" value="${esc(user.name)}" maxlength="20"><button class="btn s" style="margin-top:8px" onclick="saveName()">حفظ الاسم</button> ${user.img?'<button class="btn s" onclick="user.img=\'\';save();push();draw()">حذف الصورة</button>':''}<h2>الشارات</h2><div class="bd">${BD.map(b=>`<div class="${b[1]()?'on':''}">${b[0]}</div>`).join('')}</div>${user.email===CFG.admin?'<button class="btn p" onclick="go(\'admin\')">لوحة المشرف</button>':''}<button class="btn" onclick="out()">خروج</button>`};

function caseH(){
let h=`<button class="btn s" onclick="go()">رجوع</button><span class="stamp">${C.k==='tn'?'ملف سرّي':'لغز'}</span><h1>${esc(C.t)}</h1><div class="paper">${esc(C.i)}</div><div class="paper"><b>الأدلة:</b><br>${C.ev.map(e=>'• '+esc(e)).join('<br>')}</div>`;
if(G.res!==null){return h+`<div class="card real"><h2>تم حل القضية</h2><p class="mut" style="margin:8px 0">${esc(C.v)}</p><b>${G.res?'+'+G.res+' نقطة':'سبق حلها، بدون نقاط جديدة'}</b></div><button class="btn p" onclick="go()">قضية أخرى</button>`}
h+='<h2 style="margin-top:18px">الاستجواب</h2>';
C.s.forEach((p,si)=>{h+=`<div class="card"><div class="who">${av(p)}<div><b>${esc(p.n)}</b><div class="tag">${esc(p.r)}</div></div></div>`+(G.log[si]||[]).map(a=>`<div class="ans"><div class="tag">${esc(a[0])}</div>${esc(a[1])}</div>`).join('')+p.q.map((q,qi)=>G.asked[si+'-'+qi]?'':`<button class="q" onclick="ask(${si},${qi})">${esc(q[0])}</button>`).join('')+'</div>'});
h+=`<div class="paper"><b>الخيوط (${G.clues.length}):</b><br>${G.clues.length?G.clues.map(c=>'• '+esc(c)).join('<br>'):'ما لقيت شي لحد الآن'}</div><h2 style="margin-top:18px">اتهم القاتل</h2>`;
if(G.fail)return h+'<div class="card"><h2>فشل التحقيق</h2><p class="mut">المحكمة رفضت الاتهام. تنجم تعاود بعد ساعة.</p></div><button class="btn" onclick="go()">رجوع</button>';
if(G.stage===1){h+='<p class="mut">القاتل صحيح ✅ شكون ساعدو؟ اختار المتواطئين:</p>';C.s.forEach((p,si)=>{if(si!==C.x)h+=`<button class="btn" style="${G.sel.includes(si)?'background:var(--blood)':''}" onclick="selA(${si})">${esc(p.n)} (${esc(p.r)})</button>`});h+='<button class="btn p" onclick="confA()">تأكيد</button>'}else{h+=`<p class="mut">محاولات الاتهام الباقية: ${maxA()-G.wrong}. الاتهام يحتاج أدلة، موش تخمين.</p>`;C.s.forEach((p,si)=>{h+=`<button class="btn" onclick="accuse(${si})">${esc(p.n)} (${esc(p.r)})</button>`})}
return h}

function draw(){const v=$('#v'),n=$('#nav');if(!user){n.hidden=true;v.innerHTML=authH();return}
n.hidden=false;[...n.children].forEach(b=>b.classList.toggle('on',b.dataset.t===({admin:'me',pu:'top',real:'cases',co:'cases'}[tab]||tab)));
v.innerHTML=PU?puH():DM?dmH():RM?coH():W?editH():RF?realFileH():C?caseH():({cases:casesH,puzzles:puzH,real:realH,top:topH,me:meH,admin:admH,co:lobH,msg:msgH}[tab])();if(tab==='admin'&&!W&&!C&&!RF){loadStats();loadReports()}if(RM)coFill();if(DM)dmFill()}

const av=p=>p.img&&/^data:image\//.test(p.img)?`<img class="av" src="${esc(p.img)}" alt="">`:`<div class="av">${esc((p.n||'?')[0])}</div>`;
const inp=(v,oc,ph)=>`<input value="${esc(v||'')}" oninput="${oc}" placeholder="${ph}">`;
const ta=(v,oc,ph,n)=>`<textarea rows="${n||3}" oninput="${oc}" placeholder="${ph}">${esc(v||'')}</textarea>`;
const admH=()=>user.email!==CFG.admin?'<p class="mut">غير مسموح.</p>':`<button class="btn s" onclick="go('me')">رجوع</button><h1>لوحة المشرف</h1><div id="st" class="paper">جاري تحميل الإحصائيات...</div><div id="rp"></div>${sndH()}${siteH()}<button class="btn p" onclick="newCase()">+ قضية جديدة</button><button class="btn" onclick="seedNew()">استيراد قضايا جديدة من الملف</button>${DB?'':'<button class="btn" onclick="seed()">استيراد القضايا الحالية للقاعدة (مرة وحدة)</button>'}${D.map(c=>`<div class="card"><div class="tag">${c.k==='tn'?'مستوحاة':'لغز'}</div><b>${esc(c.t)}</b><div style="display:flex;gap:8px;margin-top:8px"><button class="btn s" onclick="editCase(${c.id})">تعديل</button><button class="btn s" onclick="delCase(${c.id})">حذف</button></div></div>`).join('')}`;
const editH=()=>{let h=`<button class="btn s" onclick="go('admin')">إلغاء</button><h1>تعديل القضية</h1><select onchange="W.k=this.value"><option value="tn"${W.k==='tn'?' selected':''}>مستوحاة (دارجة)</option><option value="pz"${W.k==='pz'?' selected':''}>لغز معقّد</option></select><label class="mut" style="display:block;margin-top:8px"><input type="checkbox"${W.sec?' checked':''} onchange="W.sec=this.checked" style="width:auto;margin-inline-end:6px"> ملف سري (ينفتح بعد حل القضايا العادية)</label>`+inp(W.tag,'W.tag=this.value','التصنيف')+inp(W.t,'W.t=this.value','عنوان القضية')+ta(W.i,'W.i=this.value','نص القضية',4)+ta((W.ev||[]).join('\n'),"W.ev=this.value.split('\\n').filter(Boolean)",'الأدلة (دليل في كل سطر)',4);
W.s.forEach((p,i)=>{h+=`<div class="card"><div class="who"><label>${av(p)}<input type="file" accept="image/*" hidden onchange="pick(${i},this)"></label><div style="flex:1">`+inp(p.n,`W.s[${i}].n=this.value`,'الاسم')+inp(p.r,`W.s[${i}].r=this.value`,'الصفة (زوجة، شريك...)')+`</div></div>`+(p.img?`<button class="btn s" onclick="W.s[${i}].img='';draw()">حذف الصورة</button>`:'')+p.q.map((q,j)=>`<div class="paper" style="padding:8px">`+inp(q[0],`W.s[${i}].q[${j}][0]=this.value`,'السؤال')+ta(q[1],`W.s[${i}].q[${j}][1]=this.value`,'الجواب',2)+inp(q[2],`W.s[${i}].q[${j}][2]=this.value`,'الخيط اللي يكتشفو (اختياري)')+`<button class="btn s" onclick="delQ(${i},${j})">حذف السؤال</button></div>`).join('')+`<button class="btn s" onclick="addQ(${i})">+ سؤال</button> <button class="btn s" onclick="delS(${i})">حذف المشتبه</button></div>`});
return h+`<button class="btn" onclick="addS()">+ مشتبه</button><h2 style="margin-top:14px">القاتل</h2><select onchange="W.x=+this.value">`+W.s.map((p,i)=>`<option value="${i}"${W.x===i?' selected':''}>${esc(p.n||'مشتبه '+(i+1))}</option>`).join('')+`</select>`+proofH()+ta(W.v,'W.v=this.value','تفسير الحل (يظهر بعد النجاح)',4)+`<button class="btn p" onclick="saveCase()">حفظ القضية</button>`};
const newS=()=>({n:'',r:'',img:'',q:[['','','']]});
function newCase(){W={id:Math.floor(Date.now()/1000),k:'tn',tag:'',t:'',i:'',ev:[],s:[newS()],x:0,v:''};draw();scrollTo(0,0)}
function editCase(id){W=JSON.parse(JSON.stringify(D.find(c=>c.id===id)));draw();scrollTo(0,0)}
function addS(){W.s.push(newS());draw()}
function delS(i){W.s.splice(i,1);W.acc=(W.acc||[]).filter(x=>x!==i).map(x=>x>i?x-1:x);if(W.x>=W.s.length)W.x=0;draw()}
function addQ(i){W.s[i].q.push(['','','']);draw()}
function delQ(i,j){W.s[i].q.splice(j,1);draw()}
function pick(i,inp){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),m=Math.min(im.width,im.height);c.width=c.height=320;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,320,320);W.s[i].img=c.toDataURL('image/jpeg',.75);URL.revokeObjectURL(im.src);draw()};im.src=URL.createObjectURL(f)}
async function loadCases(){if(!sb)return;try{const{data,error}=await sb.from('cases').select('id,data').order('sort');if(error)throw error;DB=data.length>0;if(DB)D=data.map(r=>({...r.data,id:r.id}))}catch(e){}}
async function saveCase(){if(!sb||!W.t.trim())return toast('أضف عنواناً أولاً');W.key=(W.key||[]).filter(k=>W.s.some(p=>p.q.some(q=>q[2]===k)));const{id,...rest}=W;const{error}=await sb.from('cases').upsert({id,data:rest,sort:id,updated_at:new Date().toISOString()});if(error)return toast('خطأ: '+error.message);toast('تم الحفظ ✅');await loadCases();go('admin')}
async function delCase(id){if(!DB)return toast('استورد القضايا للقاعدة أولاً');if(!confirm('حذف هذه القضية نهائياً؟'))return;const{error}=await sb.from('cases').delete().eq('id',id);if(error)return toast('خطأ: '+error.message);await loadCases();draw()}
async function seedNew(){if(!sb)return;try{if(!DB)await seed();const rows=await (await fetch('new-cases.json?'+Date.now())).json();const{error}=await sb.from('cases').upsert(rows.map(({id,...d})=>({id,data:d,sort:id})));if(error)throw error;await loadCases();draw();toast('تمت إضافة '+rows.length+' قضايا ✅')}catch(e){toast('خطأ: '+(e.message||e))}}
async function seed(){if(!sb)return;const{error}=await sb.from('cases').upsert(D.map(({id,...d})=>({id,data:d,sort:id})));if(error)return toast('خطأ: '+error.message);await loadCases();draw();toast('تم الاستيراد ✅')}
const sameSet=(a,b)=>[...a].sort().join()===[...b].sort().join();
const lobH=()=>!sb||!user.id?'<h1>العب مع صحابك</h1><p class="mut">سجّل الدخول بحساب Google أو إيميل باش تستعمل الغرف.</p>':`<h1>العب مع صحابك</h1><p class="mut">اعمل غرفة وابعث الكود. الكل يستجوب مع بعضو ويتحاور في الشات (حتى 4 لاعبين).</p><select id="rc">${D.filter(c=>!locked(c)).map(c=>`<option value="${c.id}">${esc(c.t)}</option>`).join('')}</select><button class="btn p" onclick="mkRoom()">اعمل غرفة</button><input id="rj" placeholder="كود الغرفة" maxlength="6"><button class="btn" onclick="joinCode($('#rj').value)">ادخل بالكود</button>`;
const coH=()=>`<button class="btn s" onclick="go('cases')">خروج من الغرفة</button><h1>غرفة ${RM.code}</h1><p class="mut">الكود: <b>${RM.code}</b> · <a style="color:var(--brass)" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('تعال نحلّو قضية مع بعضنا في ملفات الظل: '+location.origin+'/?room='+RM.code)}">ابعث الدعوة على واتساب</a></p><div id="cm" class="mut"></div><div id="cq"></div><h2>الشات</h2><div id="cmsgs" class="paper" style="max-height:220px;overflow:auto"></div><input id="cin" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')sendC()"><button class="btn s" style="margin-top:8px" onclick="sendC()">إرسال</button>`;
function calc(){C=D.find(c=>c.id===RM.case);if(!C)return;G={clues:[],asked:{},log:{},wrong:0,res:null,fail:false};for(const e of RM.ev){if(e.kind==='ask'){const{si,qi}=e.data,k=si+'-'+qi,q=C.s[si]&&C.s[si].q[qi];if(!q||G.asked[k])continue;G.asked[k]=1;(G.log[si]=G.log[si]||[]).push([q[0],q[1],e.name]);if(q[2]&&!G.clues.includes(q[2]))G.clues.push(q[2])}else if(e.kind==='acc'&&G.res===null&&!G.fail){const a=e.data;if(a.si===C.x&&(C.key||[]).every(k=>G.clues.includes(k))&&sameSet(a.acc||[],C.acc||[]))G.res=Math.max(10,50+G.clues.length*25-G.wrong*10)+((C.acc||[]).length?30:0);else{G.wrong++;if(G.wrong>=maxA())G.fail=true}}}if(G.res!==null&&!S.done.includes(C.id)){S.done.push(C.id);S.pts+=G.res;save();push();sfx('ok')}}
function coFill(){if(!RM||!$('#cq'))return;calc();if(!C)return void($('#cq').innerHTML='<p class="mut">هذه القضية لم تعد متوفرة.</p>');$('#cm').innerHTML='اللاعبون: '+RM.mem.map(m=>esc(m.name)).join('، ')+voiceH();let h=`<div class="paper">${esc(C.i)}</div><div class="paper"><b>الأدلة:</b><br>${C.ev.map(e=>'• '+esc(e)).join('<br>')}</div>`;

function startMusic(){if(AC)return;if(SND.music){const m=SND.music;m.loop=true;m.volume=.4;m.play().catch(()=>{});AC={state:'running',suspend(){m.pause();this.state='suspended'},resume(){m.play().catch(()=>{});this.state='running'}};return}AC=new(window.AudioContext||window.webkitAudioContext)();AMC=SITE.amb||'dark';if(AMC!=='dark'&&AMB[AMC]){const mg=AC.createGain();mg.gain.value=.3;mg.connect(AC.destination);AMB[AMC](AC,mg);return}const m=AC.createGain();m.gain.setValueAtTime(0,AC.currentTime);m.gain.linearRampToValueAtTime(.2,AC.currentTime+5);m.connect(AC.destination);const lp=AC.createBiquadFilter();lp.frequency.value=380;lp.connect(m);[55,82.4,110.5].forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.value=.22;o.connect(g);g.connect(lp);o.start()});const lf=AC.createOscillator(),lg=AC.createGain();lf.frequency.value=.07;lg.gain.value=170;lf.connect(lg);lg.connect(lp.frequency);lf.start();const n=AC.sampleRate*3,b=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5)}const cv=AC.createConvolver();cv.buffer=b;cv.connect(m);const sc=[220,261.6,293.7,329.6,392,415.3];const c0=AC;(function note(){if(AC!==c0)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=sc[Math.floor(Math.random()*6)]*(Math.random()<.3?2:1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.14,t+.05);g.gain.exponentialRampToValueAtTime(.0005,t+3.5);o.connect(g);g.connect(cv);o.start(t);o.stop(t+4);setTimeout(note,2500+Math.random()*4500)})()}

const NZ=c=>{const n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;s.loop=true;return s};

rain:(c,m)=>{const n=NZ(c),f=c.createBiquadFilter(),g=c.createGain();f.type='bandpass';f.frequency.value=2200;f.Q.value=.5;g.gain.value=.55;n.connect(f);f.connect(g);g.connect(m);n.start();DR(c,m,55,.12);LOOP(c,()=>{const t=NZ(c),l=c.createBiquadFilter(),h=c.createGain(),T=c.currentTime;l.type='lowpass';l.frequency.value=140;h.gain.setValueAtTime(0,T);h.gain.linearRampToValueAtTime(.9,T+.8);h.gain.exponentialRampToValueAtTime(.001,T+5);t.connect(l);l.connect(h);h.connect(m);t.start(T);t.stop(T+5.2)},9000,14000)},
